; =============================================================================
; platformio.ini — BASE_ES3C28P
;
; Proyecto base SOLID para ESP32-S3 con pantalla ILI9341 + táctil FT6336.
; Sirve como punto de partida para futuros proyectos en esta placa.
; =============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board    = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 115200

; ── Memoria: N16R8 (16 MB QIO Flash + 8 MB OPI PSRAM) ────────────────────────
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.f_flash             = 80000000L
board_build.f_cpu               = 240000000L
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

build_flags =
    ; PSRAM externa
    -D BOARD_HAS_PSRAM

    ; USB CDC nativo (para ver serial en el puerto USB del ESP32-S3)
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

    ; ── TFT_eSPI: configuración inyectada (sin modificar User_Setup.h) ────────
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D USE_HSPI_PORT=1

    ; ── LVGL ─────────────────────────────────────────────────────────────────
    -D LV_CONF_INCLUDE_SIMPLE
    -I src

lib_deps =
    bodmer/TFT_eSPI   @ 2.5.43
    lvgl/lvgl         @ 8.4.0
